<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Plumb: preview your wallpaper on a real Mac and iPhone lock screen</title>
    <meta name="description" content="Drop an image, see it behind the clock on a Mac or iPhone lock screen, frame it, give it a film look, and export it at native resolution. Free, and everything stays in your browser." />
    <meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plumb" />
    <meta property="og:title" content="Plumb: see your wallpaper on the lock screen first" />
    <meta property="og:description" content="Preview, frame and export wallpapers for Mac and iPhone. Free, private, in your browser." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumb: see your wallpaper on the lock screen first" />
    <meta name="twitter:description" content="Preview, frame and export wallpapers for Mac and iPhone." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <script>
      try {
        var p = localStorage.getItem('theme') || 'system';
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
